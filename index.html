<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>भारतीय संविधान · MCQ अभ्यास</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --subtext: #334155;
            --border: #e2e8f0;
            --accent: #1e4b6b;
            --accent-light: #2c6e9c;
            --shadow: 0 8px 20px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.02);
            --header-bg: #ffffff;
            --ans-bg: #eef6ff;
            --ans-text: #075985;
            --btn-bg: #f1f5f9;
            --btn-text: #1e293b;
            --search-bg: #f1f5f9;
            --icon-color: #0f172a;
        }

        body.dark {
            --bg: #0b1219;
            --card-bg: #141e2b;
            --text: #e2e8f0;
            --subtext: #b0c4de;
            --border: #2a3a4c;
            --accent: #5fa3d1;
            --accent-light: #7bb8e0;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --header-bg: #0f1a24;
            --ans-bg: #1e2d3c;
            --ans-text: #b3d9ff;
            --btn-bg: #1e2d3c;
            --btn-text: #cbd5e1;
            --search-bg: #1e2d3c;
            --icon-color: #e2e8f0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 0 12px 40px;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            z-index: 20;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
            backdrop-filter: blur(6px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            background: var(--accent);
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .menu-icon {
            font-size: 2rem;
            cursor: pointer;
            color: var(--icon-color);
            user-select: none;
            line-height: 1;
            padding: 0 6px;
        }

        .search-wrapper {
            flex: 1 1 200px;
            display: flex;
            justify-content: flex-end;
            min-width: 180px;
        }

        .search-wrapper input {
            width: 100%;
            max-width: 280px;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--search-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        .search-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(30,75,107,0.2);
        }

        /* navigation drawer (hamburger) */
        .nav-drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: 4px 0 20px rgba(0,0,0,0.2);
            z-index: 50;
            padding: 24px 16px;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .nav-drawer.open {
            left: 0;
        }

        .nav-drawer .close-btn {
            align-self: flex-end;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 4px 12px;
            color: var(--text);
            margin-bottom: 12px;
        }

        .nav-drawer a, .nav-drawer .drawer-item {
            text-decoration: none;
            color: var(--text);
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--btn-bg);
            font-weight: 500;
            display: block;
            transition: background 0.2s;
        }

        .nav-drawer .drawer-item {
            cursor: pointer;
        }

        .nav-drawer a:hover, .nav-drawer .drawer-item:hover {
            background: var(--accent);
            color: white;
        }

        .nav-drawer .theme-toggle {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--btn-bg);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 40;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* main content */
        .container {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: 0.15s;
        }

        .question {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text);
            display: flex;
            gap: 8px;
        }

        .q-num {
            color: var(--accent);
            font-weight: 700;
            min-width: 28px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0 8px 30px;
            color: var(--subtext);
            font-size: 0.98rem;
        }

        .option {
            padding: 6px 12px;
            background: var(--btn-bg);
            border-radius: 30px;
            display: inline-block;
            width: fit-content;
            border: 1px solid transparent;
        }

        .answer-box {
            margin-top: 14px;
            margin-left: 30px;
            background: var(--ans-bg);
            padding: 10px 16px;
            border-radius: 40px;
            color: var(--ans-text);
            font-weight: 600;
            display: inline-block;
            border-left: 5px solid var(--accent);
            font-size: 0.95rem;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--subtext);
            font-size: 1.2rem;
        }

        /* responsive */
        @media (max-width: 600px) {
            .header {
                padding: 10px 0;
            }
            .logo {
                font-size: 1.1rem;
            }
            .logo span {
                font-size: 0.7rem;
            }
            .search-wrapper input {
                font-size: 0.9rem;
                padding: 8px 14px;
                max-width: 150px;
            }
            .question {
                font-size: 1rem;
            }
            .options {
                margin-left: 20px;
                font-size: 0.9rem;
            }
            .answer-box {
                margin-left: 20px;
                font-size: 0.9rem;
                padding: 8px 14px;
            }
            .card {
                padding: 16px 14px;
            }
        }

        @media (max-width: 380px) {
            .search-wrapper input {
                max-width: 110px;
            }
            .options {
                margin-left: 10px;
            }
            .answer-box {
                margin-left: 10px;
            }
        }

        /* highlight search matches */
        .highlight {
            background: #fde047;
            color: #0f172a;
            border-radius: 4px;
            padding: 0 2px;
        }

        body.dark .highlight {
            background: #b45309;
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Navigation Drawer -->
    <div class="nav-drawer" id="navDrawer">
        <div class="close-btn" id="closeDrawer">✕</div>
        <a href="#" onclick="closeDrawerAndScroll(); return false;">🏠 होम</a>
        <div class="drawer-item" onclick="toggleDarkMode(); closeDrawer();">🌙 डार्क मोड</div>
        <div class="drawer-item" onclick="scrollToTop(); closeDrawer();">⬆️ ऊपर जाएँ</div>
        <a href="#" onclick="closeDrawer(); return false;">📘 सभी प्रश्न</a>
        <div style="margin-top: auto; font-size: 0.8rem; color: var(--subtext); padding: 16px 0;">कुल <span id="totalCount"></span> प्रश्न</div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <span>संविधान</span> MCQ
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="🔍 प्रश्न खोजें..." autocomplete="off">
        </div>
        <div class="menu-icon" id="menuIcon">☰</div>
    </header>

    <!-- Main Container -->
    <main class="container" id="questionContainer">
        <!-- Questions will be injected by JS -->
    </main>

    <script>
        // ---------- Question data (सभी प्रश्न शुद्ध एवं संशोधित वर्तनी के साथ) ----------
        const questionsData = [
            { q: "1922 में किस व्यक्ति ने मांग की थी कि भारत की जनता स्वयं अपने भविष्य का निर्धारण करेगी?", options: ["महात्मा गांधी", "मोतीलाल नेहरू", "गोपाल कृष्ण गोखले", "चित्तरंजन दास"], answer: "महात्मा गांधी" },
            { q: "किस व्यक्ति ने वर्ष 1922 में यह मांग की कि भारत के संविधान की संरचना हेतु गोलमेज सम्मेलन बुलाना चाहिए?", options: ["मोतीलाल नेहरू", "जवाहरलाल नेहरू", "महात्मा गांधी", "एनी बेसेंट"], answer: "मोतीलाल नेहरू" },
            { q: "कांग्रेस ने किस वर्ष किसी प्रकार के बाह्य हस्तक्षेप के बिना भारतीय जनता द्वारा संविधान के निर्माण की मांग को लेकर प्रस्ताव पारित किया था?", options: ["1928", "1931", "1936", "1942"], answer: "1936" },
            { q: "वर्ष 1938 में किस व्यक्ति ने वयस्क मताधिकार के आधार पर संविधान सभा के गठन की मांग की?", options: ["महात्मा गांधी", "जवाहरलाल नेहरू", "सुभाष चन्द्र बोस"], answer: "जवाहरलाल नेहरू" },
            { q: "वर्ष 1942 में किस योजना के तहत यह स्वीकार किया गया कि भारत में एक निर्वाचित संविधान सभा का गठन होगा जो युद्धोपरान्त संविधान का निर्माण करेगी?", options: ["कैबिनेट मिशन योजना", "वेवेल योजना", "क्रिप्स योजना", "माउण्टबेटन योजना"], answer: "क्रिप्स योजना" },
            { q: "निम्न में किसकी सिफारिश पर संविधान सभा का गठन किया गया?", options: ["क्रिप्स योजना", "कैबिनेट मिशन योजना", "वेवेल योजना", "माउण्टबेटन योजना"], answer: "कैबिनेट मिशन योजना" },
            { q: "कैबिनेट मिशन योजना में क्या संविधान निर्माण के लिये प्रस्तावित संविधान सभा को वयस्क मताधिकार के आधार पर निर्वाचित करने को स्वीकार किया गया था?", options: ["हाँ", "नहीं", "धर्म के आधार पर", "धन के आधार पर"], answer: "नहीं" },
            { q: "कैबिनेट मिशन योजना के अनुसार, संविधान सभा में कुल कितने सदस्य होने थे?", options: ["389", "429", "447", "503"], answer: "389" },
            { q: "प्रस्तावित मूल संविधान में कुल सदस्यों का बंटवारा किस प्रकार होना निश्चित हुआ था?", options: ["ब्रिटिश प्रान्तों के 292 प्रतिनिधि", "देशी रियासतों के 93 प्रतिनिधि", "मुख्य कमिश्नर क्षेत्रों के 4 प्रतिनिधि", "उपर्युक्त सभी"], answer: "उपर्युक्त सभी" },
            { q: "मुस्लिम लीग ने दो अलग-अलग संविधान सभा - एक मुस्लिमों के लिये और एक हिन्दुओं के लिये, की मांग की थी। कांग्रेस ने कितनी संविधान सभा की मांग की थी?", options: ["1", "2", "3", "4"], answer: "1" },
            { q: "कैबिनेट मिशन योजना के तहत संविधान सभा के निर्वाचन में क्या मुस्लिम लीग ने भाग लिया था?", options: ["हाँ", "नहीं", "केवल बंगाल में", "देश के केवल उत्तर-पश्चिम भाग में"], answer: "नहीं" },
            { q: "संविधान सभा के लिए चुनाव कब निश्चित हुआ?", options: ["जून 1946", "जुलाई 1946", "सितम्बर 1946", "दिसम्बर 1946"], answer: "जुलाई 1946" },
            { q: "संविधान सभा का चुनाव निम्न में से किस आधार पर हुआ?", options: ["समान मताधिकार", "सर्वमताधिकार", "सीमित मताधिकार", "वर्गीय मताधिकार"], answer: "सीमित मताधिकार" },
            { q: "संविधान सभा के सदस्य ........ प्रतिनिधि थे।", options: ["जनता द्वारा सीधे निर्वाचित", "जनता द्वारा अप्रत्यक्ष रूप से निर्वाचित", "गवर्नर जनरल द्वारा मनोनीत", "कांग्रेस और मुस्लिम लीग द्वारा नामांकित"], answer: "जनता द्वारा अप्रत्यक्ष रूप से निर्वाचित" },
            { q: "संविधान सभा के सदस्यों को निम्न में से किसने प्रत्यक्ष रूप से निर्वाचित किया?", options: ["प्रान्तों की विधानसभा", "संघीय व्यवस्थापिका", "उपर्युक्त दोनों", "उपर्युक्त में से कोई नहीं"], answer: "प्रान्तों की विधानसभा" },
            { q: "मुस्लिम लीग ने संविधान सभा का बहिष्कार किस कारण से किया?", options: ["मुस्लिम लीग संविधान सभा का अध्यक्ष किसी मुस्लिम नेता को बनाना चाहती थी", "मुस्लिम लीग को संविधान सभा में उचित प्रतिनिधित्व न मिलने के कारण", "मुस्लिम लीग मुस्लिमों के लिये एक अलग संविधान सभा चाहती थी", "उपर्युक्त सभी"], answer: "मुस्लिम लीग मुस्लिमों के लिये एक अलग संविधान सभा चाहती थी" },
            { q: "संविधान सभा में विभिन्न प्रान्तों के लिये 296 सदस्यों का निर्वाचन होना था। इनमें से कांग्रेस के कितने प्रतिनिधि निर्वाचित होकर आए थे?", options: ["198", "208", "211", "228"], answer: "208" },
            { q: "पुनर्गठन के फलस्वरूप वर्ष 1947 में संविधान सभा के सदस्यों की संख्या कितनी रह गयी?", options: ["299", "324", "344", "360"], answer: "299" },
            { q: "संविधान सभा में किस देशी रियासत के प्रतिनिधि ने भाग नहीं लिया था?", options: ["जूनागढ़", "कश्मीर", "हैदराबाद", "मैसूर"], answer: "हैदराबाद" },
            { q: "अन्तरिम सरकार में शामिल होने के बाद क्या मुस्लिम लीग ने संविधान सभा में भाग लिया?", options: ["हाँ", "नहीं", "मुस्लिम लीग के विद्रोही सदस्य", "मुस्लिम लीग की सदस्यता त्याग करने वाले सदस्य"], answer: "नहीं" },
            { q: "संविधान सभा की पहली बैठक किस दिन शुरू हुई?", options: ["29 अक्टूबर 1946", "16 नवम्बर 1946", "9 दिसम्बर 1946", "21 दिसम्बर 1946"], answer: "9 दिसम्बर 1946" },
            { q: "संविधान सभा का पहला अधिवेशन कितनी अवधि तक चला?", options: ["22 नवम्बर 1946 से 8 दिसम्बर 1946", "9 दिसम्बर 1946 से 23 दिसम्बर 1946", "11 दिसम्बर 1946 से 28 दिसम्बर 1946", "15 दिसम्बर 1946 से 23 दिसम्बर 1946"], answer: "9 दिसम्बर 1946 से 23 दिसम्बर 1946" },
            { q: "देश के स्वतन्त्र होने के पश्चात संविधान सभा की पहली बैठक कब हुई?", options: ["31 अगस्त 1947", "12 सितम्बर 1947", "24 सितम्बर 1947", "31 अक्टूबर 1947"], answer: "31 अक्टूबर 1947" },
            { q: "संविधान सभा का अस्थायी अध्यक्ष किसे चुना गया?", options: ["एच. एन. कुंजरू", "डॉ. सच्चिदानन्द सिन्हा", "गोविन्द बल्लभ पन्त", "के. टी. शाह"], answer: "डॉ. सच्चिदानन्द सिन्हा" },
            { q: "संविधान सभा का स्थायी अध्यक्ष कौन था?", options: ["बी. आर. अम्बेडकर", "डॉ. राजेन्द्र प्रसाद", "जवाहरलाल नेहरू", "अल्लादी कृष्णस्वामी अय्यर"], answer: "डॉ. राजेन्द्र प्रसाद" },

            { q: "राज्यों में संवैधानिक तंत्र विफल होने पर किस अनुच्छेद के तहत राष्ट्रपति शासन लगाया जाता है?", options: ["अनुच्छेद 352", "अनुच्छेद 356", "अनुच्छेद 360", "अनुच्छेद 365"], answer: "अनुच्छेद 356" },
            { q: "राष्ट्रपति शासन की घोषणा को कितने समय के भीतर संसद द्वारा अनुमोदित किया जाना आवश्यक है?", options: ["1 माह", "2 माह", "6 माह", "14 दिन"], answer: "2 माह" },
            { q: "किसी राज्य में राष्ट्रपति शासन सामान्यतः अधिकतम कितनी अवधि तक बढ़ाया जा सकता है?", options: ["1 वर्ष", "2 वर्ष", "3 वर्ष (विशेष शर्तों के साथ)", "अनिश्चित काल"], answer: "3 वर्ष (विशेष शर्तों के साथ)" },
            { q: "भारत में सर्वप्रथम राष्ट्रपति शासन (अनुच्छेद 356) किस राज्य में लगाया गया था?", options: ["पेप्सू / पंजाब (1951)", "केरल", "उत्तर प्रदेश", "पश्चिम बंगाल"], answer: "पेप्सू / पंजाब (1951)" },
            { q: "संविधान के किस अनुच्छेद के तहत वित्तीय आपातकाल की घोषणा की जाती है?", options: ["अनुच्छेद 352", "अनुच्छेद 356", "अनुच्छेद 360", "अनुच्छेद 368"], answer: "अनुच्छेद 360" },
            { q: "भारत में अब तक कितनी बार वित्तीय आपातकाल घोषित किया गया है?", options: ["1 बार", "2 बार", "3 बार", "एक बार भी नहीं"], answer: "एक बार भी नहीं" },
            { q: "भारत का उपराष्ट्रपति किसका पदेन सभापति (Ex-officio Chairman) होता है?", options: ["राज्यसभा का", "लोकसभा का", "योजना आयोग का", "राष्ट्रीय विकास परिषद का"], answer: "राज्यसभा का" },
            { q: "उपराष्ट्रपति के निर्वाचन मण्डल में कौन-कौन शामिल होते हैं?", options: ["संसद के दोनों सदनों के सभी सदस्य (निर्वाचित + मनोनीत)", "केवल निर्वाचित सांसद", "संसद और राज्य विधानसभाओं के सदस्य", "केवल लोकसभा के सदस्य"], answer: "संसद के दोनों सदनों के सभी सदस्य (निर्वाचित + मनोनीत)" },
            { q: "उपराष्ट्रपति पद हेतु न्यूनतम आयु सीमा क्या है?", options: ["25 वर्ष", "30 वर्ष", "35 वर्ष", "40 वर्ष"], answer: "35 वर्ष" },
            { q: "उपराष्ट्रपति अपना त्यागपत्र किसे सौंपता है?", options: ["राष्ट्रपति को", "मुख्य न्यायाधीश को", "लोकसभा अध्यक्ष को", "प्रधानमंत्री को"], answer: "राष्ट्रपति को" },
            { q: "उपराष्ट्रपति को पद से हटाने का प्रस्ताव सर्वप्रथम कहाँ पेश किया जा सकता है?", options: ["केवल राज्यसभा में", "केवल लोकसभा में", "संसद के किसी भी सदन में", "संयुक्त अधिवेशन में"], answer: "केवल राज्यसभा में" },
            { q: "भारत के प्रथम उपराष्ट्रपति कौन थे?", options: ["डॉ. सर्वपल्ली राधाकृष्णन", "डॉ. जाकिर हुसैन", "वी. वी. गिरि", "गोपाल स्वरूप पाठक"], answer: "डॉ. सर्वपल्ली राधाकृष्णन" },
            { q: "संविधान के अनुसार भारत का प्रधानमंत्री मूलतः क्या होता है?", options: ["नियुक्त (Appointed)", "निर्वाचित", "मनोनीत", "चयनित"], answer: "नियुक्त (Appointed)" },
            { q: "प्रधानमंत्री की नियुक्ति कौन करता है?", options: ["राष्ट्रपति", "लोकसभा", "संसद", "मुख्य न्यायाधीश"], answer: "राष्ट्रपति" },
            { q: "केन्द्रीय मंत्रिपरिषद सामूहिक रूप से किसके प्रति उत्तरदायी होती है?", options: ["लोकसभा के प्रति (अनुच्छेद 75(3))", "संसद के प्रति", "राष्ट्रपति के प्रति", "प्रधानमंत्री के प्रति"], answer: "लोकसभा के प्रति (अनुच्छेद 75(3))" },
            { q: "मंत्रिपरिषद के सदस्य व्यक्तिगत रूप से किसके प्रति उत्तरदायी होते हैं?", options: ["राष्ट्रपति के प्रति", "लोकसभा के प्रति", "प्रधानमंत्री के प्रति", "संसद के प्रति"], answer: "राष्ट्रपति के प्रति" },
            { q: "कोई व्यक्ति संसद का सदस्य बने बिना अधिकतम कितने समय तक मंत्री पद पर रह सकता है?", options: ["3 माह", "6 माह", "1 वर्ष", "अनिश्चित काल"], answer: "6 माह" },
            { q: "मंत्रिपरिषद में मंत्रियों की श्रेणियों का सही वरीयता क्रम क्या है?", options: ["कैबिनेट मंत्री > राज्य मंत्री > उपमंत्री", "राज्य मंत्री > कैबिनेट मंत्री > उपमंत्री", "कैबिनेट मंत्री > उपमंत्री > राज्य मंत्री", "उपमंत्री > राज्य मंत्री > कैबिनेट मंत्री"], answer: "कैबिनेट मंत्री > राज्य मंत्री > उपमंत्री" },
            { q: "भारत के प्रथम उप-प्रधानमंत्री कौन थे?", options: ["सरदार वल्लभभाई पटेल", "मोरारजी देसाई", "चौधरी चरण सिंह", "बाबू जगजीवन राम"], answer: "सरदार वल्लभभाई पटेल" },
            { q: "संसद का स्थायी व उच्च सदन कौन सा है?", options: ["राज्यसभा", "लोकसभा", "विधान परिषद", "उपर्युक्त में से कोई नहीं"], answer: "राज्यसभा" },
            { q: "राज्यसभा के सदस्यों का कार्यकाल कितने वर्ष का होता है?", options: ["4 वर्ष", "5 वर्ष", "6 वर्ष", "स्थायी (कभी समाप्त नहीं)"], answer: "6 वर्ष" },
            { q: "राज्यसभा के कितने सदस्य प्रति दो वर्ष बाद सेवानिवृत्त होते हैं?", options: ["1/2 सदस्य", "1/3 सदस्य", "1/4 सदस्य", "1/5 सदस्य"], answer: "1/3 सदस्य" },
            { q: "राज्यसभा में राष्ट्रपति द्वारा साहित्य, विज्ञान, कला और समाज सेवा से कितने सदस्य मनोनीत किये जाते हैं?", options: ["10", "12", "14", "15"], answer: "12" },
            { q: "राज्यसभा की सदस्यता हेतु न्यूनतम आयु सीमा क्या है?", options: ["21 वर्ष", "25 वर्ष", "30 वर्ष", "35 वर्ष"], answer: "30 वर्ष" },
            { q: "लोकसभा की सदस्यता हेतु न्यूनतम आयु सीमा क्या है?", options: ["18 वर्ष", "21 वर्ष", "25 वर्ष", "30 वर्ष"], answer: "25 वर्ष" },
            { q: "संसद के दोनों सदनों की संयुक्त बैठक की अध्यक्षता कौन करता है?", options: ["लोकसभा अध्यक्ष (Speaker)", "उपराष्ट्रपति (राज्यसभा सभापति)", "राष्ट्रपति", "प्रधानमंत्री"], answer: "लोकसभा अध्यक्ष (Speaker)" },
            { q: "लोकसभा की कार्यवाही चलाने के लिए आवश्यक गणपूर्ति (कोरम) कुल सदस्य संख्या का कितना भाग है?", options: ["1/10", "1/6", "1/5", "1/3"], answer: "1/10" },
            { q: "संसद के दो सत्रों के बीच अधिकतम कितना अंतराल हो सकता है?", options: ["3 माह", "6 माह", "9 माह", "1 वर्ष"], answer: "6 माह" },
            { q: "प्रथम लोकसभा के अध्यक्ष कौन थे?", options: ["गणेश वासुदेव (जी. वी.) मावलंकर", "एम. ए. अय्यंगार", "हुकुम सिंह", "के. एस. हेगड़े"], answer: "गणेश वासुदेव (जी. वी.) मावलंकर" },
            { q: "लोकसभा अध्यक्ष अपने निर्णायक मत (Casting Vote) का प्रयोग कब करता है?", options: ["प्रत्येक विधेयक पर", "केवल वित्तीय मामलों में", "पक्ष और विपक्ष में मत बराबर (Tie) होने पर", "अपनी इच्छानुसार कभी भी"], answer: "पक्ष और विपक्ष में मत बराबर (Tie) होने पर" }
        ];

        // Filter and ensure completeness
        const validQuestions = questionsData.filter(q => q.q && q.options && q.options.length > 0 && q.answer);

        // ---------- DOM refs ----------
        const container = document.getElementById('questionContainer');
        const searchInput = document.getElementById('searchInput');
        const menuIcon = document.getElementById('menuIcon');
        const navDrawer = document.getElementById('navDrawer');
        const overlay = document.getElementById('overlay');
        const closeDrawerBtn = document.getElementById('closeDrawer');
        const totalCountSpan = document.getElementById('totalCount');

        // Set total count in drawer
        totalCountSpan.textContent = validQuestions.length;

        // ---------- render questions ----------
        function renderQuestions(filterText = '') {
            const filtered = filterText.trim() === '' 
                ? validQuestions 
                : validQuestions.filter(q => 
                    q.q.toLowerCase().includes(filterText.toLowerCase()) || 
                    q.options.some(opt => opt.toLowerCase().includes(filterText.toLowerCase())) ||
                    q.answer.toLowerCase().includes(filterText.toLowerCase())
                  );

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-results">😕 कोई प्रश्न नहीं मिला। कृपया अन्य शब्द खोजें।</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const qNum = index + 1;
                let questionText = item.q;
                let answerText = item.answer;
                let optionTexts = item.options;
                const searchTerm = filterText.trim();
                if (searchTerm !== '') {
                    const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    questionText = questionText.replace(regex, '<span class="highlight">$1</span>');
                    answerText = answerText.replace(regex, '<span class="highlight">$1</span>');
                    optionTexts = optionTexts.map(opt => opt.replace(regex, '<span class="highlight">$1</span>'));
                }

                html += `
                    <div class="card">
                        <div class="question">
                            <span class="q-num">${qNum}.</span>
                            <span>${questionText}</span>
                        </div>
                        <div class="options">
                            ${optionTexts.map((opt, i) => `<div class="option">${String.fromCharCode(97 + i)}) ${opt}</div>`).join('')}
                        </div>
                        <div class="answer-box">✅ उत्तर: ${answerText}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // initial render
        renderQuestions();

        // search listener
        searchInput.addEventListener('input', (e) => {
            renderQuestions(e.target.value);
        });

        // ---------- Drawer logic ----------
        function openDrawer() {
            navDrawer.classList.add('open');
            overlay.classList.add('active');
        }

        function closeDrawer() {
            navDrawer.classList.remove('open');
            overlay.classList.remove('active');
        }

        menuIcon.addEventListener('click', openDrawer);
        closeDrawerBtn.addEventListener('click', closeDrawer);
        overlay.addEventListener('click', closeDrawer);

        // close drawer and scroll to top
        function closeDrawerAndScroll() {
            closeDrawer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ---------- Dark mode ----------
        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('mcq-theme', isDark ? 'dark' : 'light');
        }

        // load saved theme
        const savedTheme = localStorage.getItem('mcq-theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
        } else if (savedTheme === 'light') {
            document.body.classList.remove('dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark');
        }

        window.toggleDarkMode = toggleDarkMode;

        // close drawer on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && navDrawer.classList.contains('open')) {
                closeDrawer();
            }
        });
    </script>
</body>
</html>
