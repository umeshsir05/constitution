<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>भारतीय संविधान · MCQ अभ्यास</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Navigation Drawer -->
    <!-- index.html me is jagah add karein -->
<div class="nav-drawer" id="navDrawer">
    <div class="close-btn" id="closeDrawer">✕</div>
    <a href="#" onclick="closeDrawerAndScroll(); return false;">🏠 Home</a>
    <div class="drawer-item" onclick="toggleDarkMode(); closeDrawer();">🌙 Dark Mode</div>
    <div class="drawer-item" onclick="scrollToTop(); closeDrawer();">⬆️ Upar Jayein</div>
    
    <!-- 👇 YEH NAYA CODE ADD KAREIN 👇 -->
    <div class="drawer-item" onclick="scrollToBottom(); closeDrawer();">⬇️ Neeche Jayein</div>
    
    <a href="#" onclick="closeDrawer(); return false;">📘 Sabhi Prashn</a>
    <div style="margin-top: auto; font-size: 0.8rem; color: var(--subtext); padding: 16px 0;">
        Kul <span id="totalCount"></span> Prashn
    </div>
</div>


    <!-- Header -->
    <header class="header">
        <div class="logo">
            <span>संविधान</span> MCQ
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="🔍 प्रश्न खोजें..." autocomplete="off">
        </div>
        <div class="menu-icon" id="menuIcon">☰</div>
    </header>

    <!-- Main Container -->
    <main class="container" id="questionContainer">
        <!-- प्रश्न JavaScript द्वारा लोड होंगे -->
    </main>

    <script src="script.js"></script>
</body>
</html>
