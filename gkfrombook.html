<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>भारतीय संविधान · MCQ अभ्यास</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --subtext: #334155;
            --border: #e2e8f0;
            --accent: #1e4b6b;
            --accent-light: #2c6e9c;
            --shadow: 0 8px 20px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.02);
            --header-bg: #ffffff;
            --ans-bg: #eef6ff;
            --ans-text: #075985;
            --btn-bg: #f1f5f9;
            --btn-text: #1e293b;
            --search-bg: #f1f5f9;
            --icon-color: #0f172a;
        }

        body.dark {
            --bg: #0b1219;
            --card-bg: #141e2b;
            --text: #e2e8f0;
            --subtext: #b0c4de;
            --border: #2a3a4c;
            --accent: #5fa3d1;
            --accent-light: #7bb8e0;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --header-bg: #0f1a24;
            --ans-bg: #1e2d3c;
            --ans-text: #b3d9ff;
            --btn-bg: #1e2d3c;
            --btn-text: #cbd5e1;
            --search-bg: #1e2d3c;
            --icon-color: #e2e8f0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 0 12px 40px;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            z-index: 20;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
            backdrop-filter: blur(6px);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            background: var(--accent);
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .menu-icon {
            font-size: 2rem;
            cursor: pointer;
            color: var(--icon-color);
            user-select: none;
            line-height: 1;
            padding: 0 6px;
        }

        .search-wrapper {
            flex: 1 1 200px;
            display: flex;
            justify-content: flex-end;
            min-width: 180px;
        }

        .search-wrapper input {
            width: 100%;
            max-width: 280px;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--search-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        .search-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(30,75,107,0.2);
        }

        /* navigation drawer (hamburger) */
        .nav-drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: 4px 0 20px rgba(0,0,0,0.2);
            z-index: 50;
            padding: 24px 16px;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
        }

        .nav-drawer.open {
            left: 0;
        }

        .nav-drawer .close-btn {
            align-self: flex-end;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 4px 12px;
            color: var(--text);
            margin-bottom: 12px;
        }

        .nav-drawer a, .nav-drawer .drawer-item {
            text-decoration: none;
            color: var(--text);
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--btn-bg);
            font-weight: 500;
            display: block;
            transition: background 0.2s;
        }

        .nav-drawer .drawer-item {
            cursor: pointer;
        }

        .nav-drawer a:hover, .nav-drawer .drawer-item:hover {
            background: var(--accent);
            color: white;
        }

        .nav-drawer .theme-toggle {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--btn-bg);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 40;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* main content */
        .container {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: 0.15s;
        }

        .question {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text);
            display: flex;
            gap: 8px;
        }

        .q-num {
            color: var(--accent);
            font-weight: 700;
            min-width: 28px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0 8px 30px;
            color: var(--subtext);
            font-size: 0.98rem;
        }

        .option {
            padding: 6px 12px;
            background: var(--btn-bg);
            border-radius: 30px;
            display: inline-block;
            width: fit-content;
            border: 1px solid transparent;
        }

        .answer-box {
            margin-top: 14px;
            margin-left: 30px;
            background: var(--ans-bg);
            padding: 10px 16px;
            border-radius: 40px;
            color: var(--ans-text);
            font-weight: 600;
            display: inline-block;
            border-left: 5px solid var(--accent);
            font-size: 0.95rem;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--subtext);
            font-size: 1.2rem;
        }

        /* responsive */
        @media (max-width: 600px) {
            .header {
                padding: 10px 0;
            }
            .logo {
                font-size: 1.1rem;
            }
            .logo span {
                font-size: 0.7rem;
            }
            .search-wrapper input {
                font-size: 0.9rem;
                padding: 8px 14px;
                max-width: 150px;
            }
            .question {
                font-size: 1rem;
            }
            .options {
                margin-left: 20px;
                font-size: 0.9rem;
            }
            .answer-box {
                margin-left: 20px;
                font-size: 0.9rem;
                padding: 8px 14px;
            }
            .card {
                padding: 16px 14px;
            }
        }

        @media (max-width: 380px) {
            .search-wrapper input {
                max-width: 110px;
            }
            .options {
                margin-left: 10px;
            }
            .answer-box {
                margin-left: 10px;
            }
        }

        /* highlight search matches */
        .highlight {
            background: #fde047;
            color: #0f172a;
            border-radius: 4px;
            padding: 0 2px;
        }

        body.dark .highlight {
            background: #b45309;
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Navigation Drawer -->
    <div class="nav-drawer" id="navDrawer">
        <div class="close-btn" id="closeDrawer">✕</div>
        <a href="#" onclick="closeDrawerAndScroll(); return false;">🏠 होम</a>
        <div class="drawer-item" onclick="toggleDarkMode(); closeDrawer();">🌙 डार्क मोड</div>
        <div class="drawer-item" onclick="scrollToTop(); closeDrawer();">⬆️ ऊपर जाएँ</div>
        <a href="#" onclick="closeDrawer(); return false;">📘 सभी प्रश्न</a>
        <div style="margin-top: auto; font-size: 0.8rem; color: var(--subtext); padding: 16px 0;">कुल <span id="totalCount"></span> प्रश्न</div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="logo">
            <span>संविधान</span> MCQ
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="🔍 प्रश्न खोजें..." autocomplete="off">
        </div>
        <div class="menu-icon" id="menuIcon">☰</div>
    </header>

    <!-- Main Container -->
    <main class="container" id="questionContainer">
        <!-- Questions will be injected by JS -->
    </main>

    <script>
        // ---------- Question data (all complete questions from the document) ----------
        const questionsData = [
            { q: "1922 में किस व्यक्ति ने मांग की थी कि भारत की जनता स्वयं अपने भविष्य का निर्धारण करेंगी?", options: ["महात्मा गांधी", "मोती लाल नेहरू", "गोपाल कृष्ण गोखले", "चित्तरंजन दास"], answer: "महात्मा गांधी" },
            { q: "किस व्यक्ति ने वर्ष 1922 में यह मांग की कि भारत के संविधान की संरचना हेतु गोलमेज सम्मेलन बुलाना चाहिए?", options: ["मोती लाल नेहरू", "जवाहर लाल नेहरू", "महात्मा गांधी", "एनी बेसेन्ट"], answer: "मोती लाल नेहरू" },
            { q: "कांग्रेस ने किस वर्ष किसी प्रकार के बाह्य हस्तक्षेप के बिना भारतीय जनता द्वारा संविधान के निर्माण की मांग को लेकर प्रस्ताव पारित किया था?", options: ["1928", "1931", "1936", "1942"], answer: "1936" },
            { q: "वर्ष 1938 में किस व्यक्ति ने व्यक्त भाविका के आधार पर संविधान सभा के गठन की मांग की?", options: ["महात्मा गांधी", "जवाहर लाल नेहरू", "सुभाष चन्द्र बोस"], answer: "जवाहर लाल नेहरू" },
            { q: "वर्ष 1942 में किस योजना के तहत यह स्वीकार किया गया कि भारत में एक निर्वाचित संविधान सभा का गठन होगा जो युद्धोपरान्त संविधान का निर्माण करेगी?", options: ["कैकिनेट मिशन योजना", "वेलेल योजना", "क्रिप्स योजना", "माउण्टबेटन योजना"], answer: "क्रिप्स योजना" },
            { q: "निम्न में किसकी सिफारिश पर संविधान सभा का गठन किया गया?", options: ["क्रिप्स योजना", "कैकिनेट मिशन योजना", "वेलेल योजना", "माउण्टबेटन योजना"], answer: "कैकिनेट मिशन योजना" },
            { q: "कैकिनेट मिशन योजना में क्या संविधान निर्माण के लिये प्रस्तावित संविधान सभा को व्यवक्त मताधिकार के आधार पर निर्वाचित करने को स्वीकार किया गया था?", options: ["हाँ", "नहीं", "धर्म के आधार पर", "धन के आधार पर"], answer: "नहीं" },
            { q: "कैकिनेट मिशन योजना के अनुसार, संविधान सभा में कुल कितने सदस्य होने थे?", options: ["389", "429", "447", "503"], answer: "389" },
            { q: "प्रस्तावित मूल संविधान में कुल सदस्यों का बंटवारा किस प्रकार होना निश्चित हुआ था?", options: ["क्रिटिश प्रान्तों के 292 प्रतिनिधि", "देशी रियासतों के 93 प्रतिनिधि", "मुख्य कमिशनर क्षेत्रों के 4 प्रतिनिधि", "उपर्युक्त सभी"], answer: "उपर्युक्त सभी" },
            { q: "मुख्यम लीग ने दो अलग-अलग संविधान सभा - एक मुख्यमों के लिये और एक हिन्दुओं के लिये, की मांग की थी। कांग्रेस ने कितने संविधान सभा की मांग की थी?", options: ["1", "2", "3", "4"], answer: "1" },
            { q: "कैकिनेट मिशन योजना के तहत संविधान सभा के निर्वाचन में क्या मुख्यम लीग ने भाग लिया था?", options: ["हाँ", "नहीं", "केवल बंगाल में", "देश के केवल उत्तर-पश्चिम भाग में"], answer: "नहीं" },
            { q: "संविधान सभा के लिए चुनाव कब निश्चित हुआ?", options: ["जून 1946", "जुलाई 1946", "सितम्बर 1946", "दिसम्बर 1946"], answer: "जुलाई 1946" },
            { q: "संविधान सभा का चुनाव निम्न में से किस आधार पर हुआ?", options: ["समान मताधिकार", "सर्वमताधिकार", "सीमित मताधिकार", "वर्गीय मताधिकार"], answer: "सीमित मताधिकार" },
            { q: "संविधान सभा के सदस्य ........ प्रतिनिधि थे।", options: ["जनता द्वारा सीधे निर्वाचित", "जनता द्वारा अप्रत्यक्ष रूप से निर्वाचित", "गर्वनर जनरल द्वारा मनोनीत", "कांग्रेस और मुख्यम लीग द्वारा नामांकित"], answer: "जनता द्वारा अप्रत्यक्ष रूप से निर्वाचित" },
            { q: "संविधान सभा के सदस्यों को निम्न में से किसने प्रत्यक्ष रुप से निर्वाचित किया?", options: ["प्रान्तों की विधानसभा", "संघीय व्यवस्थापिका", "उपर्युक्त दोनों", "उपर्युक्त में से कोई नहीं"], answer: "प्रान्तों की विधानसभा" },
            { q: "मुख्यम लीग ने संविधान सभा का बहिष्कार किस कारण से किया?", options: ["मुख्यम लीग संविधान सभा का अध्यक्ष किसी मुख्यम नेता को बनाना चाहता था", "मुख्यम लीग को संविधान सभा में उचित प्रतिनिधित्व न मिलने के कारण", "मुख्यम लीग मुख्यमों के लिये एक अलग संविधान सभा चाहता था", "उपर्युक्त सभी"], answer: "मुख्यम लीग मुख्यमों के लिये एक अलग संविधान सभा चाहता था" },
            { q: "संविधान सभा में विभिन्न प्रांन्तों के लिये 296 सदस्यों का निर्वाचन होना था। इनमें से कांग्रेस के कितने प्रतिनिधि निर्वाचित होकर आए थे?", options: ["198", "211", "228", "233"], answer: "211" },
            { q: "पुनर्गठन के फलस्वरूप वर्ष 1947 में संविधान सभा के सदस्यों की संख्या कितनी रह गयी?", options: ["299", "324", "344", "360"], answer: "299" },
            { q: "संविधान सभा में किस देशी रियासत के प्रतिनिधि ने भाग नहीं लिया था?", options: ["जूनागढ", "कश्मीर", "हैदराबाद", "मैसूर"], answer: "हैदराबाद" },
            { q: "अन्तरिम सरकार में शामिल होने के बाद क्या मुख्यम लीग ने संविधान सभा में भाग लिया?", options: ["हाँ", "नहीं", "मुख्यम लीग के विद्रोही सदस्य", "मुख्यम लीग की सदस्यता त्याग करने वाले सदस्य"], answer: "नहीं" },
            { q: "संविधान सभा की पहली बैठक किस दिन शुरू हुई?", options: ["29 अक्टूबर 1946", "16 नवम्बर 1946", "9 दिसम्बर 1946", "21 दिसम्बर 1946"], answer: "9 दिसम्बर 1946" },
            { q: "संविधान सभा का पहला अधिवेशन कितनी अवधि तक चला?", options: ["22 नवम्बर 1946 से 8 दिसम्बर 1946", "9 दिसम्बर 1946 से 23 दिसम्बर 1946", "11 दिसम्बर 1946 से 28 दिसम्बर 1946", "15 दिसम्बर 1946 से 23 दिसम्बर 1946"], answer: "9 दिसम्बर 1946 से 23 दिसम्बर 1946" },
            { q: "देश के स्वतन्त्र होने के पश्चात संविधान सभा की पहली बैठक कब हुई?", options: ["31 अगस्त 1947", "12 सितम्बर 1947", "24 सितम्बर 1947", "31 अक्टूबर 1947"], answer: "31 अक्टूबर 1947" },
            { q: "संविधान सभा का अस्थायी अध्यक्ष किसे चुना गया?", options: ["एच. एन. कुंजल", "डा. सञ्चिदानन्द सिन्हा", "गोविन्द बल्लभ पन्त", "के. टी. शाह"], answer: "डा. सञ्चिदानन्द सिन्हा" },
            { q: "संविधान सभा का स्थायी अध्यक्ष कौन था?", options: ["बी. आर. अब्बेडकर", "डा. रानेन्द्र प्रसाद", "जवाहर लाल नेहरू", "अल्लादी कृष्णस्वामी आयंगर"], answer: "डा. रानेन्द्र प्रसाद" },
            { q: "संविधान निर्माण की दिशा में पहला कार्य ‘उद्देश्य प्रस्ताव’ था 22 नववरी 1947 को यह प्रस्ताव किसने प्रस्तुत किया?", options: ["महात्मा गांधी", "जवाहर लाल नेहरू", "के. एम. मुशी", "बी. आर. अब्बेडकर"], answer: "जवाहर लाल नेहरू" },

            { q: "आपातकाल की घोषणा के बाद केन्द्र को राज्य से सम्बन्धित संविधान के प्रभु भाग को या उसके किसी भाग को निलम्बित करने की शक्ति प्राप्त नहीं है। क्या राष्ट्रपति शासन के दौरान भी यही स्थिति रहती है?", options: ["हाँ", "नहीं", "यदि संसद ऐसा करने के लिये संकल्प पारित करे", "यदि मंत्रिमंडल ऐसा करने की सिफारिश करे"], answer: "हाँ" },
            { q: "राष्ट्रपति शासन की अधिकतम अवधि 3 वर्ष की है। राज्यपाल आपातकाल की अधिकतम अवधि क्या सीमा है?", options: ["2 वर्ष", "3 वर्ष", "5 वर्ष", "कोई सीमा नहीं"], answer: "कोई सीमा नहीं" },
            { q: "राष्ट्रपति शासन के दौरान संविधान के किस अनुच्छेद द्वारा प्रदत्त स्वतन्त्रताओं पर रोक लगायी जा सकती है?", options: ["अनुच्छेद 14", "अनुच्छेद 17", "अनुच्छेद 19", "अनुच्छेद 26"], answer: "अनुच्छेद 19" },
            { q: "संविधान लागू होने के बाद से अब तक राष्ट्रपति शासन कितनी बार लागू किया गया है?", options: ["89", "92", "98", "102"], answer: "98" },
            { q: "पहली बार राष्ट्रपति शासन कब लागू किया गया?", options: ["4 अप्रैल 1951", "20 जुलाई 1951", "27 अगस्त 1951", "23 दिसम्बर 1951"], answer: "20 जुलाई 1951" },
            { q: "किस राज्य में राष्ट्रपति शासन को पहली बार लागू किया गया?", options: ["केरल", "पश्चिम बंगाल", "तमिलनाडु (मद्रास)", "पंजाब (पेप्सू)"], answer: "पंजाब (पेप्सू)" },
            { q: "किस संघ शासित क्षेत्र में राष्ट्रपति शासन को पहली बार लागू किया गया?", options: ["गोआ", "मणिपुर", "दिल्ली", "पाण्डिचेरी"], answer: "पाण्डिचेरी" },
            { q: "किस राज्य में सर्वाधिक बार राष्ट्रपति शासन लागू किया गया है?", options: ["पश्चिम बंगाल, उत्तर प्रदेश", "बिहार, केरल", "पंजाब, केरल", "तमिलनाडु, बिहार"], answer: "पंजाब, केरल" },
            { q: "किस संघ शासित क्षेत्र में राष्ट्रपति शासन का सबसे अधिक बार प्रयोग किया गया है?", options: ["गोआ", "चण्डीगढ़", "दिल्ली", "पाण्डिचेरी"], answer: "पाण्डिचेरी" },
            { q: "अब तक किस राज्य में सबसे लम्बी अवधि के लिये राष्ट्रपति शासन लागू रहा?", options: ["नगालैण्ड", "पंजाब", "असम", "जम्मू-कश्मीर"], answer: "पंजाब" },
            { q: "किस राज्य में सबसे अल्प अवधि (16 दिसम्बर 1976 से 28 दिसम्बर 1976) के लिये राष्ट्रपति शासन लागू रहा?", options: ["केरल", "उड़ीसा", "गुजरात", "महाराष्ट्र"], answer: "उड़ीसा" },
            { q: "वर्ष 1977 में केन्द्र में जनता सरकार और 1980 में कांग्रेस (इ) सरकार सत्ता में आने के पर्यन्त एक मात्र क्रमशः कितने राज्यों में राष्ट्रपति शासन लागू किया गया?", options: ["6, 7", "7, 10", "9, 9", "9, 11"], answer: "9, 11" },
            { q: "संविधान के किस अनुच्छेद के आधार पर वित्तीय आपात की उद्घोषणा राष्ट्रपति करता है?", options: ["अनुच्छेद 358", "अनुच्छेद 359", "अनुच्छेद 360", "अनुच्छेद 361"], answer: "अनुच्छेद 360" },
            { q: "देश में वित्तीय आपात की घोषणा अब कितनी बार किया गया है?", options: ["1", "2", "3", "अभी तक नहीं"], answer: "अभी तक नहीं" },
            { q: "वित्तीय आपात के दौरान क्या राष्ट्रपति संघ और राज्य के अधिकारियों, जिनमें सर्वोच्च न्यायालय एवं उच्च न्यायालय के न्यायाधीश भी है, के वेतनों में कमी आवश्यक कमी कर सकता है?", options: ["हाँ", "नहीं", "संविधित अधिकारियों द्वारा लिखित सहमति मिलने पर", "यदि मंत्रिपरिषद राष्ट्रपति को ऐसा करने की सलाह दे"], answer: "हाँ" },
            { q: "वित्तीय आपात के दौरान राष्ट्रपति राज्य के किस प्रकार के विधेयकों को स्थीकृति के लिये प्रस्तुत किये जाने के लिये वापस कर सकता है?", options: ["साधारण विधेयक", "वित्तीय विधेयक", "उपर्युक्त दोनों", "उपर्युक्त में से कोई नहीं"], answer: "वित्तीय विधेयक" },
            { q: "भारत के राष्ट्रपति को निम्न में से किससे वेतन दिया जाता है?", options: ["भारत की संचित निधि से", "भारत की आकस्मिक निधि से", "उपर्युक्त दोनों से", "उपर्युक्त किसी से नहीं"], answer: "भारत की संचित निधि से" },
            { q: "क्या राष्ट्रपति को मंत्रिपरिषद की सलाह के विपरीत कार्य करने की शक्ति है?", options: ["हाँ", "नहीं", "विशेष परिस्थिति में", "संवैधानिक प्रावधानों के तहत"], answer: "नहीं" },
            { q: "हिन्दू आयर सहिंता विधेयक को लेकर प्रधानमंत्री से किस राष्ट्रपति का विवाद हुआ था?", options: ["डा. राजेन्द्र प्रसाद", "डा० सर्वपल्ली राधाकृष्णन", "वी.वी. गिरि", "ज्ञानी जैल सिंह"], answer: "डा. राजेन्द्र प्रसाद" },
            { q: "\"राष्ट्रपति की वही स्थिति है जो ब्रिटिश संविधान में सम्राट की है। वह राष्ट्र का प्रधान है, कार्यपालिका का नहीं। वह राष्ट्र का प्रतिनिधित्व करता है, उसका शासन नहीं। वह साधारणतः मन्त्रियों के परामर्श का पालन करने के लिये बाध्य होगा। वह न तो उपेक्षा परामर्शों के विरुद्ध कुछ कर सकता है न उपेक्षा परामर्शों के बिना ही।\" यह किसका कथन है?", options: ["बी. आर. अम्बेडकर", "जवाहर लाल नेहरू", "डा. राजेन्द्र प्रसाद", "के. एम. मुंशी"], answer: "बी. आर. अम्बेडकर" },
            { q: "उपराष्ट्रपति का पद -", options: ["संविधान में प्रारम्भ से ही है", "एक संवैधानिक संशोधन द्वारा सृजित किया गया है", "एक संसदीय अधिनियम द्वारा सृजित किया गया है", "अमेरिका के संविधान से लिया गया है"], answer: "संविधान में प्रारम्भ से ही है" },
            // ---- Page 22 ----
            { q: "जब उपराष्ट्रपति राष्ट्रपति के पद पर कार्य करता है तब -", options: ["राज्यसभा के सभापति का पद रिक्त रहता है", "राज्यसभा अपना नया सभापति चुनती है", "उप सभापति सभापति के पद का कार्यभार संभालता है", "लोकसभा का अध्यक्ष राज्य सभा के सभापति का कार्य भी देखता है"], answer: "राज्यसभा के सभापति का पद रिक्त रहता है" },
            { q: "उपराष्ट्रपति के सम्बन्ध में कौन सा कथन सत्य है?", options: ["वह संसद का एक भाग होता है", "वह संसद के किसी सदन का सदस्य होता है", "वह राज्यसभा का सदस्य होता है", "वह संसद का सदस्य नहीं होता है"], answer: "वह संसद का सदस्य नहीं होता है" },
            { q: "संविधान में उपराष्ट्रपति के पुनर्निर्वाचन के सम्बन्ध क्या प्रावधान है?", options: ["कुछ भी नहीं", "एक से अधिक बार में प्रतिबन्ध", "अधिकतम दो बार के लिये पुनर्निर्वाचन", "अधिकतम तीन बार के लिये पुनर्निर्वाचन"], answer: "कुछ भी नहीं" },
            { q: "भारत के उपराष्ट्रपति की स्थिति की तुलना किस देख के उपराष्ट्रपति से की जा सकती है?", options: ["सं. रा. अमेरिका", "दक्षिण अफ्रीका", "फ्रान्स", "मित्र"], answer: "सं. रा. अमेरिका" },
            { q: "उपराष्ट्रपति अपना त्यागपत्र किसे सम्बोधित करता है?", options: ["राष्ट्रपति", "सर्वोच्च न्यायालय के मुख्य न्यायाधीश", "लोकसभा के अध्यक्ष", "राज्यसभा के उपसभापति"], answer: "राष्ट्रपति" },
            { q: "निम्न में से कौन सा कथन असत्य है?", options: ["उपराष्ट्रपति को पदच्युत करने के लिये महाभियोग की आवश्यकता नहीं पड़ती है", "उपराष्ट्रपति के निर्वाचन सम्बन्धी सभी विवादों को निर्वाचन आयोग देखता है", "यदि उपराष्ट्रपति का निर्वाचन अवैध घोषित कर दिया जाये तो ऐसे निर्णय के पूर्व उनके द्वारा सम्पन्न कार्य अवैध नहीं होंगे", "उपर्युक्त सभी"], answer: "उपराष्ट्रपति के निर्वाचन सम्बन्धी सभी विवादों को निर्वाचन आयोग देखता है" },
            { q: "भारत के राष्ट्रपति निर्वाचित होने के पूर्व निम्न में से कौन उपराष्ट्रपति नहीं था?", options: ["डा. सर्वपल्ली राधाकृष्णन", "डा. जाकिर हुसैन", "वी. वी. गिरि", "झानी जैल सिंह"], answer: "झानी जैल सिंह" },
            { q: "निम्न में से कौन सर्वाधिक अवधि तक उपराष्ट्रपति के पद पर आसीन रहा?", options: ["डा. सर्वपल्ली राधाकृष्णन", "वी. वी. गिरि", "डा. जाकिर हुसैन", "बी. डी. जत्ती"], answer: "डा. सर्वपल्ली राधाकृष्णन" },
            { q: "निम्न में से कौन सबसे कम समय के लिये उपराष्ट्रपति पद पर आसीन रहा?", options: ["डा. जाकिर हुसैन", "वी. वी. गिरि", "बी. डी. जत्ती", "के. आर. नारायणन"], answer: "वी. वी. गिरि" },
            { q: "भारत का प्रथम उपराष्ट्रपति कौन था?", options: ["डा. सर्वपल्ली राधाकृष्णन", "डा. जाकिर हुसैन", "आचार्य जे. बी. कृपलानी", "जी. एस. पाठक"], answer: "डा. सर्वपल्ली राधाकृष्णन" },
            { q: "उपराष्ट्रपति पद की अहर्ता के सम्बन्ध में क्या असत्य है?", options: ["भारत का नागरिक हो", "कम से कम 35 वर्ष की आयु हो", "राज्य सभा का सदस्य हो", "उपर्युक्त में से कोई नहीं"], answer: "राज्य सभा का सदस्य हो" },
            { q: "उपराष्ट्रपति के निर्वाचन में निर्वाचक मण्डल के सदस्य कौन होते हैं?", options: ["लोकसभा के निर्वाचित सदस्य", "संसद के सभी निर्वाचित सदस्य", "संसद के सभी सदस्य", "संसद एवं राज्य विधानमण्डलों के सभी सदस्य"], answer: "संसद के सभी सदस्य" },
            { q: "उपराष्ट्रपति के स्पष्टन में क्या सत्य है?", options: ["वह लोकसभा का पदेन अध्यक्ष होता है", "वह राज्यसभा का पदेन अध्यक्ष होता है", "वह भारतीय रेडकास सोसाइटी का पदेन अध्यक्ष होता है", "वह किसी का पदेन अध्यक्ष नहीं होता"], answer: "वह राज्यसभा का पदेन अध्यक्ष होता है" },
            { q: "उपराष्ट्रपति को कार्यकाल पूरा होने के पूर्व पदच्युत किया जा सकता है -", options: ["राष्ट्रपति द्वारा", "सर्वोच्च न्यायालय", "राज्यसभा के साधारण बहुमत द्वारा पारित प्रस्ताव जिसकी स्वीकृति लोकसभा दे", "राज्यसभा के 3/3 बहुमत द्वारा पारित प्रस्ताव जिसकी स्वीकृति लोकसभा दे"], answer: "राज्यसभा के साधारण बहुमत द्वारा पारित प्रस्ताव जिसकी स्वीकृति लोकसभा दे" },
            { q: "उपराष्ट्रपति राष्ट्रपति का कार्यभार संभालता है जबकि राष्ट्रपति -", options: ["अनुपस्थित हो", "अपना कार्य करने में अक्षम हो", "उपर्युक्त सभी मामलों में", "मृत्यु हो गई हो"], answer: "उपर्युक्त सभी मामलों में" },

            { q: "नवनिर्वाचित लोकसभा के गठन के पूर्व निर्वाचित सदस्यों में से किसी एक (परम्परा के अनुसार वित्रित सदस्यों के अध्यक्षों को सभी नियुक्ति सदस्यों को शपथ ग्रहण करवाता है।", options: ["राष्ट्रपति", "प्रधानमंत्री", "निवर्तमान लोकसभा के अध्यक्ष", "निर्वाचन आयोग"], answer: "निवर्तमान लोकसभा के अध्यक्ष" },
            { q: "लोकसभा के अध्यक्ष को कौन पद की शपथ ग्रहण करवाता है?", options: ["राष्ट्रपति", "सर्वोच्च न्यायालय का मुख्य न्यायाधीश", "निवर्तमान लोकसभा का अध्यक्ष", "शपथ ग्रहण की आवश्यकता नहीं होती"], answer: "राष्ट्रपति" },
            { q: "लोकसभा के अध्यक्ष को किस प्रकार पद से हटाया जा सकता है?", options: ["लोकसभा के सदस्यों द्वारा साधारण बहुमत से संकल्प पारित कर", "लोकसभा के संदस्यों द्वारा दो तिहाई बहुमत से संकल्प पारित कर", "संसद के सदस्यों द्वारा साधारण बहुमत से संकल्प पारित कर", "संसद के सदस्यों द्वारा दो-तिहाई बहुमत से संकल्प पारित कर"], answer: "लोकसभा के सदस्यों द्वारा साधारण बहुमत से संकल्प पारित कर" },
            { q: "जब अध्यक्ष को पदच्युत करने के संकल्प पर लोकसभा विचार कर रही हो तब क्या वह सदन की अध्यक्षता कर सकता है?", options: ["हाँ", "नहीं", "केवल उपस्थित रहकर आरोप के बारे में सफाई दे सकता है", "अस्पष्ट"], answer: "नहीं" },
            { q: "प्रथम लोकसभा का अध्यक्ष कौन था?", options: ["एम. ए. आयंगर", "जी. वी. मावलंकर", "हुकुम सिंह", "के. एस. हेगडे"], answer: "जी. वी. मावलंकर" },
            { q: "चौथी लोकसभा के कार्यकाल के दौरान निम्न में कौन लोकसभा का अध्यक्ष नहीं था?", options: ["हुकुम सिंह", "गुरदयाल सिंह दिल्लों", "नीलम संजीव रेड्डी", "बलिराम भगत"], answer: "नीलम संजीव रेड्डी" },
            { q: "लोकसभा का अध्यक्ष सदन में विधेयक या संकल्प को पारित प्रक्रिया के दौरान क्या मतदान करता है?", options: ["हाँ", "नहीं", "किसी प्रश्न पर पक्ष एवं विपक्ष में समान मतों की स्थिति में निर्णायक मत", "केवल पक्ष में"], answer: "किसी प्रश्न पर पक्ष एवं विपक्ष में समान मतों की स्थिति में निर्णायक मत" },
            { q: "लोकसभा में गणपूर्ति न होने की स्थिति में अध्यक्ष क्या कर सकता है?", options: ["सदन का स्थगन", "सदन का निलम्बन", "उपर्युक्त में से कुछ भी", "उपर्युक्त में से कोई नहीं"], answer: "सदन का स्थगन" },
            { q: "संविधान के प्रावधानों के अनुसार क्या यह आवश्यक है कि अध्यक्ष पद पर निर्वाचित होने के बाद वह अपने राजनीतिक दल की सदस्यता से त्यागपत्र से त्यागपत्र दे?", options: ["हाँ", "नहीं", "उपर्युक्त में से कुछ भी", "उपर्युक्त में से कोई नहीं"], answer: "नहीं" }
        ];

        // Remove any duplicate or invalid entries
        const validQuestions = questionsData.filter(q => q.q && q.options && q.options.length > 0 && q.answer);

        // ---------- DOM refs ----------
        const container = document.getElementById('questionContainer');
        const searchInput = document.getElementById('searchInput');
        const menuIcon = document.getElementById('menuIcon');
        const navDrawer = document.getElementById('navDrawer');
        const overlay = document.getElementById('overlay');
        const closeDrawerBtn = document.getElementById('closeDrawer');
        const totalCountSpan = document.getElementById('totalCount');

        // Set total count in drawer
        totalCountSpan.textContent = validQuestions.length;

        // ---------- render questions ----------
        function renderQuestions(filterText = '') {
            const filtered = filterText.trim() === '' 
                ? validQuestions 
                : validQuestions.filter(q => 
                    q.q.toLowerCase().includes(filterText.toLowerCase()) || 
                    q.options.some(opt => opt.toLowerCase().includes(filterText.toLowerCase())) ||
                    q.answer.toLowerCase().includes(filterText.toLowerCase())
                  );

            if (filtered.length === 0) {
                container.innerHTML = `<div class="no-results">😕 कोई प्रश्न नहीं मिला। कृपया अन्य शब्द खोजें।</div>`;
                return;
            }

            let html = '';
            filtered.forEach((item, index) => {
                const qNum = index + 1;
                let questionText = item.q;
                let answerText = item.answer;
                let optionTexts = item.options;
                const searchTerm = filterText.trim();
                if (searchTerm !== '') {
                    const regex = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    questionText = questionText.replace(regex, '<span class="highlight">$1</span>');
                    answerText = answerText.replace(regex, '<span class="highlight">$1</span>');
                    optionTexts = optionTexts.map(opt => opt.replace(regex, '<span class="highlight">$1</span>'));
                }

                html += `
                    <div class="card">
                        <div class="question">
                            <span class="q-num">${qNum}.</span>
                            <span>${questionText}</span>
                        </div>
                        <div class="options">
                            ${optionTexts.map((opt, i) => `<div class="option">${String.fromCharCode(97 + i)}) ${opt}</div>`).join('')}
                        </div>
                        <div class="answer-box">✅ उत्तर: ${answerText}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // initial render
        renderQuestions();

        // search listener
        searchInput.addEventListener('input', (e) => {
            renderQuestions(e.target.value);
        });

        // ---------- Drawer logic ----------
        function openDrawer() {
            navDrawer.classList.add('open');
            overlay.classList.add('active');
        }

        function closeDrawer() {
            navDrawer.classList.remove('open');
            overlay.classList.remove('active');
        }

        menuIcon.addEventListener('click', openDrawer);
        closeDrawerBtn.addEventListener('click', closeDrawer);
        overlay.addEventListener('click', closeDrawer);

        // close drawer and scroll to top
        function closeDrawerAndScroll() {
            closeDrawer();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ---------- Dark mode ----------
        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('mcq-theme', isDark ? 'dark' : 'light');
        }

        // load saved theme
        const savedTheme = localStorage.getItem('mcq-theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
        } else if (savedTheme === 'light') {
            document.body.classList.remove('dark');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark');
        }

        window.toggleDarkMode = toggleDarkMode;

        // close drawer on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && navDrawer.classList.contains('open')) {
                closeDrawer();
            }
        });
    </script>
</body>
</html>
